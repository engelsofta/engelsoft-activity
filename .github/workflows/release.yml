name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python scripts/package.py --tag "$GITHUB_REF_NAME"
      - name: Publish runtime archives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --title "Engelsoft Activity $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
